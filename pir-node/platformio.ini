; PIR node: XIAO nRF52840 + PIR. Sends a trigger packet on motion and a heartbeat beacon.
;   pio run                 build
;   pio run -t upload       flash over USB
;   pio device monitor      read the serial log
[platformio]
default_envs = pir_node
boards_dir = ../common/xiao_nrf52840/boards   ; XIAO nRF52840 board definition (see ../common/xiao_nrf52840/NOTICE)

[env:pir_node]
platform = nordicnrf52
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
board_build.ldscript = ../common/xiao_nrf52840/boards/nrf52840_s140_v7.ld  ; framework has no nRF52840 + S140 7.3.0 script; this is its v6 one with flash starting at 0x27000
lib_extra_dirs = ../common/lib
build_flags =
  -I ../common/xiao_nrf52840/variants/xiao_nrf52
  -D LOG_SERIAL=1        ; 0 for current measurements: USB keeps the chip awake
  -D LED_ON_TRIGGER=1    ; 0 for current measurements
  ; -D TX_POWER_DBM=4    ; test variable: -40 .. +8
  ; -D HEARTBEAT_MS=5000
build_src_filter = +<*> +<../../common/xiao_nrf52840/variants/xiao_nrf52>
upload_protocol = nrfutil
monitor_speed = 115200
