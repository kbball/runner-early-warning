; Camera node camera: XIAO ESP32-S3 Sense. Powered only when the trigger board raises the boost EN.
; On boot it reports on its UART, grabs frames for a session, reports a verdict, and goes to sleep.
; Plain ESP-IDF (not Arduino): ESP-DL, which runs the person model, needs ESP-IDF 5.3 or newer.
;   pio run                    build
;   pio run -t upload          flash app, partition table and the person model (hold B, tap R, release B if it fails)
;   pio device monitor         read the debug log (USB serial); the EW,... lines go out on D6, not here
[platformio]
default_envs = camera_node

[env:camera_node]
platform = espressif32@6.11.0
board = seeed_xiao_esp32s3
framework = espidf
board_build.partitions = partitions.csv
extra_scripts = post:model_partition.py
; ESP-DL's CMake needs cmake_language (3.18+); PlatformIO bundles 3.16.
platform_packages =
  platformio/tool-cmake@3.30.2
monitor_speed = 115200
build_flags =
  ; ---- test variables (defaults are in src/node.cpp)
  ; -D SESSION_MS=30000
  ; -D FRAME_INTERVAL_MS=0
  ; -D STUB_FORCE_PERSON=1        ; skip the model: report PERSON after a few frames, to test the chain
  ; -D MESHCORE_FRAMES=1          ; also send MeshCore companion frames on a confirmed person

; Bench viewer, not the node firmware: the board becomes a Wi-Fi AP serving a live view of the camera with
; the person detections drawn on it.
;   pio run -e camera_view -t upload ; join Wi-Fi "ew-camera" ; open http://192.168.4.1/
;   Reflash camera_node afterwards (pio run -e camera_node -t upload).
[env:camera_view]
platform = espressif32@6.11.0
board = seeed_xiao_esp32s3
framework = espidf
board_build.partitions = partitions.csv
extra_scripts = post:model_partition.py
platform_packages =
  platformio/tool-cmake@3.30.2
monitor_speed = 115200
build_flags =
  -D EW_VIEWER=1
