; Camera node camera: XIAO ESP32-S3 Sense. Powered only when the trigger board raises the boost EN.
; On boot it reports on its UART, grabs frames for a session, reports a verdict, and goes to sleep.
;   pio run                 build
;   pio run -t upload       flash over USB (the camera board's own USB-C, with the boost off the rail)
;   pio device monitor      read the debug log (USB serial); the EW,... lines go out on D6, not here
[platformio]
default_envs = camera_node

[env:camera_node]
build_src_filter = +<*>
platform = espressif32@6.11.0
board = seeed_xiao_esp32s3
framework = arduino
lib_extra_dirs = ../common/lib
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1   ; Serial = USB debug log; Serial0 = the hardware UART on D6/D7
  -D CORE_DEBUG_LEVEL=0
  ; ---- test variables (defaults are in src/main.cpp)
  ; -D SESSION_MS=30000
  ; -D FRAME_INTERVAL_MS=200
  ; -D STUB_FORCE_PERSON=1        ; report PERSON after a few frames, to test the chain without a model
  ; -D SAVE_FRAMES=0              ; 1 saves JPEGs to the microSD card
  ; -D MESHCORE_FRAMES=1          ; also send MeshCore companion frames on a confirmed person
monitor_speed = 115200

; Bench viewer, not the node firmware: the board becomes a Wi-Fi AP serving a live MJPEG view of the camera.
;   pio run -e camera_view -t upload ; join Wi-Fi "ew-camera" ; open http://192.168.4.1/
;   Reflash camera_node afterwards (pio run -e camera_node -t upload).
[env:camera_view]
platform = espressif32@6.11.0
board = seeed_xiao_esp32s3
framework = arduino
build_src_filter = -<*> +<../bench/view.cpp>
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=0
monitor_speed = 115200
